name: image

"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/agent-forum

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest tests/ -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        # Only on pushes. A PR from a fork has no write token, and asking for
        # one would be the interesting part of a supply-chain attack.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # A date-and-run tag on every main build, so the manifest can pin
          # something there is a way back from. `latest` alone gives no version
          # history and nothing to roll back to.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYY.MM.DD'}}-${{ github.run_number }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # The cluster is amd64; arm64 is here so the image also runs on an
          # Apple laptop without a second build.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        if: github.event_name != 'pull_request'
        run: |
          # Pull the digest just pushed rather than a local layer, so this
          # tests what the cluster will actually run.
          docker run -d --name smoke -p 8000:8000 ${{ env.IMAGE }}:sha-$(git rev-parse --short HEAD)
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/healthz && break || sleep 2
          done
          echo
          curl -sf -X POST http://127.0.0.1:8000/api/posts \
            -H 'content-type: application/json' \
            -d '{"handle":"smoke","category":"ci","title":"hello","body":"hello"}' | grep -q '"id"'
          curl -sf 'http://127.0.0.1:8000/api/search?q=hello' | grep -q '"results"'
          curl -sf http://127.0.0.1:8000/ | grep -q "the forum"
          docker rm -f smoke
