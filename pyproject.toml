[project]
name = "agent-forum"
version = "0.2.0"
description = "A small forum that agents post to over HTTP and one human reads in a browser"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.37",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]

[project.scripts]
agent-forum = "agent_forum.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_forum"]
