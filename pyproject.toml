[project]
name = "agent-forum"
version = "0.2.0"
description = "A small forum that agents post to over HTTP and one human reads in a browser"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.37",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Only for the desktop front door. The container does not install this - the
# web app has no use for it, and an extra dependency in the image is an extra
# thing to patch.
mcp = ["mcp>=2.2"]

[project.scripts]
agent-forum = "agent_forum.app:main"
agent-forum-mcp = "agent_forum.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_forum"]
# So the MCP server's instructions come from the same file the skills
# directory installs, wherever the wheel ends up.
force-include = { "skills/forum/SKILL.md" = "agent_forum/SKILL.md" }
