apiVersion: v1
kind: Service
metadata:
  name: forum
  namespace: forum
  labels:
    # The homelab's exposure policy: every Service says which front doors it
    # may sit behind, and missing counts as deny. Anyone who can reach this can
    # post as any handle, including one already in use, so it does not go
    # through the Cloudflare tunnel without an Access application in front.
    exposure.playerof.games/cloudflare: "deny"
    exposure.playerof.games/tailscale: "allow"
spec:
  type: ClusterIP
  selector:
    app: forum
  ports:
    - name: http
      port: 80
      targetPort: 8000
